name: Demo site
# Publishes the web page with the saved results in examples/results/ to GitHub Pages, so anyone can
# browse real scan results without Docker or an API key. Live scanning is switched off there.
# Needs Settings > Pages > Source: "GitHub Actions". Skipped while the repository is private.
on:
  push:
    branches: [main]
    paths:
      - "examples/results/**"
      - "agenttrap/web/**"
      - "agenttrap/results.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - run: agenttrap export --results examples/results site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
